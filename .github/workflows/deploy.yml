name: Deploy to Firebase Hosting

# Auto-deploys the PWA to Firebase Hosting on push to main (see docs/SETUP-FIREBASE.md, step 8):
#   - repository variable  FIREBASE_PROJECT_ID  (kinun-ae894)
#   - repository secret    FIREBASE_SERVICE_ACCOUNT  (service-account JSON with "Firebase Hosting Admin")
# The job is skipped if FIREBASE_PROJECT_ID is empty. Doc-only changes are ignored.
# This workflow uploads Hosting only; Firestore rules still need a manual deploy.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
